# Publica o painel web (web/, com login e menu Administração) no GitHub Pages.
# Endereço: https://badenpowelll.github.io/vigigen/
# Pré-requisito único: Settings > Pages > Source = "GitHub Actions".
# A URL e a chave publicável do Supabase são públicas por desenho (o acesso é
# controlado pelo login e pela RLS no banco); nenhuma chave secreta entra aqui.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://tizmhihnggbvjzsmnpne.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_GF_pXwItfZ4T3bG1sONu1w_4j8FcQVA
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
