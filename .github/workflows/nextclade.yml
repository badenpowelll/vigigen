# Classificação semanal das sequências com o Nextclade, seguida da detecção
# de mudança de linhagem (R1, R2, R3), que grava alertas com status "novo".
# Segredo necessário no repositório: DATABASE_URL. Datasets em dois passos
# (D-013, escolhidos por Baden em 2026-10-16 a partir de `nextclade dataset list`);
# as variáveis do repositório, se definidas, substituem os padrões abaixo.
name: nextclade
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"   # terça, depois da carga do GenBank
jobs:
  classificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Instalar Nextclade CLI (versão fixa, para a análise ser reproduzível)
        env:
          NEXTCLADE_VERSAO: ${{ vars.NEXTCLADE_VERSAO || '3.29.0' }}
        run: |
          curl -fsSL "https://github.com/nextstrain/nextclade/releases/download/${NEXTCLADE_VERSAO}/nextclade-x86_64-unknown-linux-gnu" -o /usr/local/bin/nextclade
          chmod +x /usr/local/bin/nextclade
          nextclade --version
      - name: Exportar, classificar e carregar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTCLADE_DATASET_SOROTIPO: ${{ vars.NEXTCLADE_DATASET_SOROTIPO || 'nextstrain/dengue/all' }}
          NEXTCLADE_DATASET_LINHAGEM: ${{ vars.NEXTCLADE_DATASET_LINHAGEM || 'community/v-gen-lab/dengue/denv{n}' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Falta o segredo DATABASE_URL no repositório"; exit 1; fi
          python -m src.db.load exportar-fasta data/interim/seq.fasta
          python -m src.pipeline.classify rodar --fasta data/interim/seq.fasta
          python -m src.db.load carregar-nextclade data/interim/nextclade/classificacao.tsv
          python -m src.db.load detectar-alertas data/interim/nextclade/deteccao.json
      - uses: actions/upload-artifact@v4
        with:
          name: nextclade-saida
          path: data/interim/nextclade/
